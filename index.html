<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연속 통과 확률기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
/* Layout: 폭 480px 한 장짜리 카드. 확률 → 카운터 → 버튼 → 설정 순. 통계는 팝업. */
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#18202e; --muted:#5d6779; --line:#dbe0e8;
  --accent:#2f54d6; --accent-ink:#ffffff; --good:#13804b; --bad:#c43a3a; --soft:#eef1f8; --scrim:rgba(15,19,27,.45);
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --panel:#171d29; --ink:#e7ebf3; --muted:#9aa4b8; --line:#283041;
  --accent:#7d98ff; --accent-ink:#0f131b; --good:#4cc98a; --bad:#ff7b7b; --soft:#1e2534; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --panel:#171d29; --ink:#e7ebf3; --muted:#9aa4b8; --line:#283041;
  --accent:#7d98ff; --accent-ink:#0f131b; --good:#4cc98a; --bad:#ff7b7b; --soft:#1e2534; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0;padding-block:16px 24px;padding-inline:16px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:480px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}

/* 헤더 */
.top{display:flex;align-items:center;gap:6px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 auto 0 0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.ib svg{width:18px;height:18px}
.ib[aria-pressed="false"]{color:var(--muted)}

/* 확률 요약 */
.odds{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px}
.odd{padding:8px 12px;min-width:0;display:grid;gap:1px}
.odd + .odd{border-left:1px solid var(--line)}
.odd-l{font-size:11px;font-weight:700;color:var(--muted)}
.odd-v{font:600 20px/1.2 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.odd-s{font-size:11px;color:var(--muted)}
.odd-s b{font:500 11px var(--f-mono);color:var(--ink)}

/* 시도 횟수 */
.att{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;padding:0 2px}
.att-v{font-size:13px;color:var(--muted);white-space:nowrap}
.att-v b{font:600 22px var(--f-mono);color:var(--ink);margin-right:2px;font-variant-numeric:tabular-nums}
.att-v.won b{color:var(--good)}
.att-s{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.att-s b{font:600 12px var(--f-mono)}
.att-s b.under,.cmptag.under{color:var(--good)}
.att-s b.over,.cmptag.over{color:var(--bad)}
.att-s b.eq,.cmptag.eq{color:var(--accent)}
.cmptag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,currentColor 13%,transparent);white-space:nowrap}
.att-s{margin-left:auto}
.tally{display:inline-flex;align-items:baseline;gap:5px}
.tally b{font-size:15px}
.tally i{font-style:normal;color:var(--line)}
.tally .tl{font-size:11px}

/* 카운터 */
.counter{display:flex;align-items:center;gap:10px}
.big{font-family:var(--f-display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums;min-width:1ch;transition:color .2s}
.big.pop{animation:pop .15s ease-out}
@keyframes pop{from{transform:translateY(-4px);opacity:.55}to{transform:none;opacity:1}}
.cmeta{display:grid;gap:4px;min-width:0;flex:1}
.cline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.live{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.how{font-size:12px;color:var(--muted)}
.roll{font:400 12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.trail{display:flex;flex-wrap:wrap;gap:3px;height:8px;overflow:hidden}
.trail i{width:8px;height:8px;border-radius:2px;background:var(--good)}
.trail i.x{background:var(--bad)}

/* 버튼 */
.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{height:36px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.38;cursor:not-allowed}

/* 설정 */
.set{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:10px}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.input{font:500 16px var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;width:100%;min-width:0}
.input:focus-visible{outline-offset:0}
.suffix{position:relative}
.suffix .input{padding-right:28px}
.suffix span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font:13px var(--f-mono)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{white-space:nowrap;padding:0 2px;height:30px;border:0;border-radius:6px;background:transparent;color:var(--ink);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.nums{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nums .tilde{color:var(--muted)}
.stepper{display:inline-grid;grid-template-columns:32px 48px 32px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:transparent;color:var(--ink);font-size:17px;height:34px}
.stepper button:active{background:var(--soft)}
.stepper input{border:0;border-radius:0;text-align:center;background:transparent;height:34px;padding:0}
.unit{font-size:13px;color:var(--muted)}
.rule{font-size:12px;color:var(--muted)}
.rule b{color:var(--accent);font-weight:700}
.err{color:var(--bad);font-size:12px}
.speed{display:flex;align-items:center;gap:10px;min-width:0}
.speed input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:24px;margin:0}
.speed output{font:12px var(--f-mono);color:var(--muted);width:48px;text-align:right}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:500;white-space:nowrap}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .track{width:32px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.toggle .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
.toggle input:checked + .track{background:var(--accent)}
.toggle input:checked + .track::after{transform:translateX(14px)}
.toggle input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* 통계 팝업 */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:20}
.modal{width:100%;max-width:400px;max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh h2{margin:0;font-size:16px}
dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
dt{color:var(--muted)}
dd{margin:0;text-align:right;font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.hist{font:12px var(--f-mono);display:flex;flex-wrap:wrap;gap:4px;color:var(--muted)}
.hist span{padding:1px 6px;border-radius:5px;background:var(--soft)}
.hist .g{color:var(--good)} .hist .b{color:var(--bad)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cmp,.decgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 14px;align-items:center}
.cmp{background:var(--soft);border-radius:12px;padding:12px}
.cmp .ch,.decgrid .ch{font-size:11px;font-weight:700;color:var(--muted);text-align:right}
.decgrid .ch{text-align:center}
.cmp .rh,.decgrid .rh{color:var(--muted)}
.cmp b{font:600 15px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.cmp b:nth-of-type(odd){color:var(--accent)}
.decgrid .stepper{grid-template-columns:30px 36px 30px}
.grp{display:grid;gap:8px}
.grp + .grp{padding-top:14px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--muted)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:11px;color:var(--muted);text-align:center;margin:0}
@media (hover:none){.hint{display:none}}
/* 모바일: 화면 크기에 맞춰 전체를 확대(JS가 zoom 계산)하고, 남는 높이는 숫자 영역이 채움 */
html.fit body{padding-block:12px;padding-inline:16px}
html.fit .app{display:flex;flex-direction:column;margin:0 auto}
html.fit .counter{flex:1 1 0;flex-direction:column;align-items:stretch;gap:6px;min-height:0;overflow:hidden}
html.fit .bigbox{flex:1 1 0;min-height:0;container-type:size;display:grid;place-items:center;overflow:hidden}
html.fit .big{text-align:center;font-size:min(105cqh,70cqw);line-height:.95}
html.fit .cmeta{flex:none;padding-bottom:4px;justify-items:center;text-align:center}
html.fit .cline{justify-content:center}
html.fit .att{flex-wrap:nowrap}
html.fit .app.done .roll{display:none}
html.fit .cmeta{gap:3px}
html.fit .att-v,html.fit .tally{white-space:nowrap}
html.fit .trail{justify-content:center}
html.fit .hint{display:none}
html.fit .top h1{font-size:18px}
html.fit .row{grid-template-columns:60px minmax(0,1fr)}
html.fit .seg button{font-size:12px}
@media (prefers-reduced-motion:reduce){.big.pop{animation:none}.toggle .track,.toggle .track::after{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>연속 통과 확률기</h1>
    <button class="ib" id="statsBtn" type="button" aria-label="통계 열기" title="통계">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </button>
    <button class="ib" id="setBtn" type="button" aria-label="설정 열기" title="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    <button class="ib" id="sound" type="button" aria-pressed="true" aria-label="효과음" title="효과음">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path id="mute" d="m16 9 6 6m0-6-6 6" hidden/></svg>
    </button>
  </header>

  <div class="odds" aria-live="polite">
    <div class="odd"><span class="odd-l">성공 확률 (이론)</span><span class="odd-v" id="tP">-</span><span class="odd-s">실제 <b id="rP">-</b></span></div>
    <div class="odd"><span class="odd-l">평균 시도횟수 (이론)</span><span class="odd-v" id="tN">-</span><span class="odd-s">실제 <b id="rN">-</b></span></div>
  </div>

  <div class="att" aria-live="polite">
    <span class="att-v"><b id="attN">1</b>번째 시도</span>
    <span class="att-s tally" id="attLast" title="평균 시도횟수와 비교한 성공 횟수"></span>
  </div>

  <div class="counter">
    <div class="bigbox"><span class="big" id="big">0</span></div>
    <div class="cmeta">
      <div class="cline"><span class="chip" id="chip">대기 중</span><span class="cmptag" id="attCmp" hidden></span><span class="how" id="how">회 통과</span></div>
      <div class="roll" id="roll">시작을 누르면 판정이 시작됩니다.</div>
      <div class="trail" id="trail" aria-hidden="true"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="start" type="button">시작</button>
    <button class="btn ghost" id="skip" type="button" disabled>스킵</button>
  </div>

  <section class="set" aria-label="설정">
    <div class="row">
      <label class="lbl" for="x">통과 확률</label>
      <div class="suffix"><input class="input" id="x" type="number" inputmode="decimal" min="0" max="100" step="any" value="50"><span>%</span></div>
    </div>
    <div class="row">
      <span class="lbl">성공 조건</span>
      <div class="seg" role="group" aria-label="성공 조건">
        <button type="button" data-mode="gte" aria-pressed="true">이상</button>
        <button type="button" data-mode="lte" aria-pressed="false">이하</button>
        <button type="button" data-mode="range" aria-pressed="false">범위</button>
        <button type="button" data-mode="eq" aria-pressed="false">정확히</button>
      </div>
    </div>
    <div class="row">
      <label class="lbl" for="z" id="zlbl">목표 횟수</label>
      <div class="nums">
        <span class="stepper"><button type="button" data-step="z:-1" aria-label="1 줄이기">−</button><input class="input" id="z" type="number" inputmode="numeric" min="0" step="1" value="2"><button type="button" data-step="z:1" aria-label="1 늘리기">+</button></span>
        <span class="tilde" id="tilde" hidden>~</span>
        <span class="stepper" id="z2wrap" hidden><button type="button" data-step="z2:-1" aria-label="최대 횟수 1 줄이기">−</button><input class="input" id="z2" type="number" inputmode="numeric" min="0" step="1" value="4" aria-label="최대 횟수"><button type="button" data-step="z2:1" aria-label="최대 횟수 1 늘리기">+</button></span>
        <span class="unit">회</span>
      </div>
    </div>
    <div class="rule" id="rule"></div>
    <div class="err" id="err" role="alert" hidden></div>
  </section>
  <p class="hint">스페이스바: 시작 / 스킵</p>
</div>

<div class="scrim" id="statsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mh"><h2 id="mtitle">통계</h2><button class="ib" data-close type="button" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="cmp">
      <span></span><span class="ch">이론</span><span class="ch">실제</span>
      <span class="rh">성공 확률</span><b id="sTP">-</b><b id="sRP">-</b>
      <span class="rh">평균 시도횟수</span><b id="sTN">-</b><b id="sRN">-</b>
    </div>
    <dl>
      <dt>진행한 판</dt><dd id="rRuns">0</dd>
      <dt>성공 / 실패</dt><dd id="rSF">0 / 0</dd>
    </dl>
    <div style="display:grid;gap:6px">
      <span class="lbl">최근 기록 (멈춘 숫자)</span>
      <div class="hist" id="hist"><span>아직 없음</span></div>
    </div>
    <div class="mbtns">
      <button class="btn ghost sm" id="batch" type="button">1,000판 즉시 계산</button>
      <button class="btn ghost sm" id="reset" type="button">기록 초기화</button>
    </div>
  </div>
</div>

<div class="scrim" id="setModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="stitle">
    <div class="mh"><h2 id="stitle">설정</h2><button class="ib" data-close type="button" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="grp">
      <span class="lbl">올라가는 속도</span>
      <div class="speed">
        <input id="speed" type="range" min="20" max="600" step="10" value="220" aria-label="판정 간격">
        <output id="speedv" for="speed"></output>
      </div>
      <label class="toggle" for="accel">
        <input id="accel" type="checkbox" checked><span class="track" aria-hidden="true"></span>점점 빨라지기
      </label>
      <div class="speed" id="maxWrap">
        <span class="note" style="white-space:nowrap">최고 속도</span>
        <input id="maxspeed" type="range" min="5" max="300" step="5" value="20" aria-label="최고 속도 (가장 짧은 간격)">
        <output id="maxv" for="maxspeed"></output>
      </div>
      <span class="note">켜면 통과할 때마다 간격이 12%씩 짧아지고, 최고 속도에 닿으면 그 속도를 유지합니다.</span>
    </div>
    <div class="grp">
      <span class="lbl">소수점 자리수</span>
      <div class="decgrid">
        <span></span><span class="ch">확률</span><span class="ch">횟수</span>
        <span class="rh">메인</span>
        <span class="stepper"><button type="button" data-step="decMP:-1" aria-label="메인 확률 소수점 줄이기">−</button><input class="input" id="decMP" type="number" inputmode="numeric" min="0" max="12" step="1" value="2" aria-label="메인 확률 소수점"><button type="button" data-step="decMP:1" aria-label="메인 확률 소수점 늘리기">+</button></span>
        <span class="stepper"><button type="button" data-step="decMN:-1" aria-label="메인 횟수 소수점 줄이기">−</button><input class="input" id="decMN" type="number" inputmode="numeric" min="0" max="12" step="1" value="0" aria-label="메인 횟수 소수점"><button type="button" data-step="decMN:1" aria-label="메인 횟수 소수점 늘리기">+</button></span>
        <span class="rh">통계</span>
        <span class="stepper"><button type="button" data-step="decSP:-1" aria-label="통계 확률 소수점 줄이기">−</button><input class="input" id="decSP" type="number" inputmode="numeric" min="0" max="12" step="1" value="2" aria-label="통계 확률 소수점"><button type="button" data-step="decSP:1" aria-label="통계 확률 소수점 늘리기">+</button></span>
        <span class="stepper"><button type="button" data-step="decSN:-1" aria-label="통계 횟수 소수점 줄이기">−</button><input class="input" id="decSN" type="number" inputmode="numeric" min="0" max="12" step="1" value="2" aria-label="통계 횟수 소수점"><button type="button" data-step="decSN:1" aria-label="통계 횟수 소수점 늘리기">+</button></span>
      </div>
      <span class="note" id="decPreview"></span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const S = { mode:'gte', timer:null, count:0, running:false, runs:0, wins:0, hist:[], cfg:null, lastDecided:null, att:0, succ:[] };

/* ---------- 효과음 ---------- */
const Snd = {
  ctx:null, on:true,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } }
          if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(freq,dur,type='triangle',vol=0.12,when=0,slideTo=null){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime+when, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.02);
  },
  // 셰퍼드 톤: 첫 통과부터 같은 방식으로 한 음씩 올라가고, 12번마다 같은 음으로 돌아오지만 끝없이 오르는 것처럼 들림
  pass(k){
    const step=(k-1)%12, base=24.5*Math.pow(2,step/12);   // G0부터 반음씩
    const center=Math.log2(523.25), sigma=1.0;             // C5 근처가 가장 크게
    const parts=[];
    for(let o=0;o<10;o++){
      const f=base*Math.pow(2,o); if(f<50||f>8000) continue;
      const w=Math.exp(-Math.pow(Math.log2(f)-center,2)/(2*sigma*sigma));
      if(w>0.01) parts.push([f,w]);
    }
    const sum=parts.reduce((t,p)=>t+p[1],0)||1;            // 음역이 바뀌어도 전체 크기는 일정하게
    parts.forEach(([f,w])=>this.tone(f,0.09,'sine',0.16*w/sum));
  },
  stop(){ this.tone(180,0.18,'square',0.05,0,90); },
  locked(win){ win?this.tone(1568,0.12,'sine',0.08):this.tone(220,0.12,'sine',0.08); },
  win(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,0.22,'triangle',0.11,i*0.08)); },
  lose(){ this.tone(311.13,0.22,'sawtooth',0.05,0); this.tone(233.08,0.36,'sawtooth',0.05,0.16,196); },
  click(){ this.tone(900,0.03,'sine',0.05); }
};
try{ if(localStorage.getItem('chainroll-sound')==='off') Snd.on=false; }catch(e){}
function paintSound(){
  $('sound').setAttribute('aria-pressed',Snd.on);
  $('sound').title = Snd.on?'효과음 켜짐':'효과음 꺼짐';
  $('waves').toggleAttribute('hidden',!Snd.on); $('mute').toggleAttribute('hidden',Snd.on);
}
$('sound').addEventListener('click',()=>{ Snd.on=!Snd.on; paintSound(); Snd.init(); Snd.click(); try{ localStorage.setItem('chainroll-sound',Snd.on?'on':'off'); }catch(e){} });
paintSound();

/* ---------- 계산 ---------- */
function cfg(){
  const X=parseFloat($('x').value), Z=Number($('z').value), Z2=Number($('z2').value);
  const dg=id=>{ const v=parseInt($(id).value,10); return v>=0?Math.min(v,12):0; };
  const d={mp:dg('decMP'),mn:dg('decMN'),sp:dg('decSP'),sn:dg('decSN')};
  let err='';
  if(!(X>0&&X<100)) err='통과 확률은 0보다 크고 100보다 작게 입력해 주세요.';
  else if(!Number.isInteger(Z)||Z<0) err=(S.mode==='range'?'최소 횟수':'목표 횟수')+'는 0 이상의 정수로 입력해 주세요.';
  else if(S.mode==='range'&&(!Number.isInteger(Z2)||Z2<Z)) err='최대 횟수는 최소 횟수보다 크거나 같은 정수로 입력해 주세요.';
  return {p:X/100,X,Z,Z2,d,err,mode:S.mode};
}
function decided(c,k){
  if(c.mode==='gte') return k>=c.Z?'win':null;
  if(c.mode==='lte') return k>c.Z?'lose':null;
  if(c.mode==='range') return k>c.Z2?'lose':null;
  return k>c.Z?'lose':null;
}
function judge(c,k){
  if(c.mode==='gte') return k>=c.Z;
  if(c.mode==='lte') return k<=c.Z;
  if(c.mode==='range') return k>=c.Z&&k<=c.Z2;
  return k===c.Z;
}
function theory(c){
  const p=c.p, pw=n=>Math.pow(p,n);
  if(c.mode==='gte') return pw(c.Z);
  if(c.mode==='lte') return 1-pw(c.Z+1);
  if(c.mode==='range') return pw(c.Z)-pw(c.Z2+1);
  return pw(c.Z)*(1-p);
}
const fmt=(v,d)=>Number.isFinite(v)?v.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d}):'-';
const pct=(v,d)=>fmt(v*100,d)+'%';
const times=(P,d)=>P>0?fmt(1/P,d)+'번':'성공 불가';
function ruleText(c){
  const x=`${c.X}%`;
  if(c.mode==='gte') return `${x} 판정을 <b>${c.Z}번 이상</b> 연속 통과하면 성공`;
  if(c.mode==='lte') return `연속 통과가 <b>${c.Z}번 이하</b>에서 멈추면 성공`;
  if(c.mode==='range') return `연속 통과가 <b>${c.Z}~${c.Z2}번</b>에서 멈추면 성공`;
  return `<b>정확히 ${c.Z}번</b> 통과하고 멈추면 성공`;
}
function refresh(){
  const c=cfg();
  $('err').hidden=!c.err; $('err').textContent=c.err;
  $('rule').innerHTML=c.err?'':ruleText(c); $('rule').hidden=!!c.err;
  $('speedv').textContent=$('speed').value+'ms';
  $('maxv').textContent=$('maxspeed').value+'ms';
  $('maxspeed').disabled=!$('accel').checked; $('maxWrap').style.opacity=$('accel').checked?'':'.45';
  const ranged=S.mode==='range';
  $('z2wrap').hidden=!ranged; $('tilde').hidden=!ranged;
  $('zlbl').textContent=ranged?'횟수 범위':'목표 횟수';
  $('start').disabled=!!c.err||S.running; $('batch').disabled=!!c.err||S.running;
  document.querySelectorAll('.seg button').forEach(b=>b.disabled=S.running);
  const P=c.err?NaN:Math.max(0,theory(c)), d=c.d;
  const tp=dp=>c.err?'-':pct(P,dp), tn=dn=>c.err?'-':times(P,dn);
  const rp=dp=>S.runs?pct(S.wins/S.runs,dp):'-';
  const rn=dn=>S.runs?(S.wins?fmt(S.runs/S.wins,dn)+'번':'성공 없음'):'-';
  S.decN=d.mn; S.decTag=Math.max(d.mn,d.sn);
  $('tP').textContent=tp(d.mp); $('tN').textContent=tn(d.mn);
  $('rP').textContent=rp(d.mp); $('rN').textContent=rn(d.mn);
  $('sTP').textContent=tp(d.sp); $('sTN').textContent=tn(d.sn);
  $('sRP').textContent=rp(d.sp); $('sRN').textContent=rn(d.sn);
  $('decPreview').textContent=`예: 메인 ${fmt(12.3456789,d.mp)}% · ${fmt(8.1003,d.mn)}번 / 통계 ${fmt(12.3456789,d.sp)}% · ${fmt(8.1003,d.sn)}번`;
  $('rRuns').textContent=S.runs.toLocaleString('ko-KR');
  $('rSF').textContent=`${S.wins.toLocaleString('ko-KR')} / ${(S.runs-S.wins).toLocaleString('ko-KR')}`;
  return c;
}

/* ---------- 화면 ---------- */
function setChip(state){
  const ch=$('chip');
  ch.className='chip'+(state==='win'?' good':state==='lose'?' bad':S.running?' live':'');
  ch.textContent=state==='win'?'성공 확정':state==='lose'?'실패 확정':S.running?'진행 중':'대기 중';
}
function showCount(k){ const b=$('big'); b.textContent=k; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
function addMark(ok){ const i=document.createElement('i'); if(!ok) i.className='x'; const t=$('trail'); t.appendChild(i); while(t.children.length>60) t.removeChild(t.firstChild); }
function paintHist(){ $('hist').innerHTML=S.hist.length?S.hist.map(h=>`<span class="${h.win?'g':'b'}">${h.k}</span>`).join(''):'<span>아직 없음</span>'; }
/* 성공까지의 시도 횟수 (직접 플레이한 판만, 1,000판 계산은 제외) */
function cmpAvg(n,avg){ if(!Number.isFinite(avg)) return 'eq'; return Math.abs(n-avg)<1e-9?'eq':n<avg?'under':'over'; }
const CMP_TXT={under:'평균 미만',eq:'평균 정확',over:'평균 초과'};
function countAttempt(win,avg){
  S.att++;
  if(!win) return null;
  const e={n:S.att,avg,r:cmpAvg(S.att,avg)}; S.succ.unshift(e); S.att=0; return e;
}
function paintAttempt(n,state,e){
  const v=$('attN').parentElement;
  $('attN').textContent=n;
  v.classList.toggle('won',state==='won');
  v.lastChild.textContent = state==='won'?'번째 시도에 성공':state==='lost'?'번째 시도 실패':'번째 시도';
  const tag=$('attCmp');
  if(state==='won'&&e){
    tag.hidden=false; tag.className='cmptag '+e.r;
    tag.textContent=`${CMP_TXT[e.r]} (평균 ${fmt(e.avg,S.decTag)}번)`;
  } else tag.hidden=true;
  const t={over:0,eq:0,under:0}; S.succ.forEach(x=>t[x.r]++);
  $('attLast').innerHTML = `<span class="tl">초과</span><b class="over">${t.over}</b><i>|</i><span class="tl">정확</span><b class="eq">${t.eq}</b><i>|</i><span class="tl">미만</span><b class="under">${t.under}</b>`;
}
function pushHist(k,win){ S.hist.unshift({k,win}); if(S.hist.length>40) S.hist.length=40; paintHist(); }

function finish(c,k,how){
  clearTimeout(S.timer); S.running=false;
  document.querySelector('.app').classList.add('done');
  const win=judge(c,k);
  S.runs++; if(win) S.wins++; pushHist(k,win);
  const e=countAttempt(win, 1/theory(c));
  win ? paintAttempt(e.n,'won',e) : paintAttempt(S.att,'lost');
  $('big').textContent=k; $('big').style.color=win?'var(--good)':'var(--bad)';
  const ch=$('chip'); ch.className='chip '+(win?'good':'bad'); ch.textContent=win?'성공':'실패';
  $('how').textContent=how;
  $('start').textContent='다시 시작'; $('skip').disabled=true;
  setTimeout(()=>win?Snd.win():Snd.lose(),60);
  refresh();
}
function start(){
  Snd.init();
  const c=refresh(); if(c.err||S.running) return;
  document.querySelector('.app').classList.remove('done');
  S.running=true; S.count=0; S.cfg=c; S.lastDecided=decided(c,0);
  $('big').textContent='0'; $('big').style.color=''; $('trail').innerHTML=''; $('how').textContent='회 통과';
  $('skip').disabled=false; refresh(); setChip(S.lastDecided);
  paintAttempt(S.att+1,'now');
  S.timer=setTimeout(tick,120);
}
function tick(){
  const c=S.cfg, r=Math.random()*100, ok=r<c.X;
  $('roll').textContent=`#${S.count+1}  ${r.toFixed(2)} ${ok?'<':'≥'} ${c.X}  ${ok?'통과':'실패'}`;
  addMark(ok);
  if(!ok){ Snd.stop(); finish(c,S.count,`${S.count}회 통과 후 멈춤`); return; }
  S.count++; showCount(S.count); Snd.pass(S.count);
  const d=decided(c,S.count);
  if(d&&!S.lastDecided) Snd.locked(d==='win');
  S.lastDecided=d; setChip(d);
  const base=Number($('speed').value);
  S.timer=setTimeout(tick, $('accel').checked?Math.max(Math.min(Number($('maxspeed').value),base),base*Math.pow(0.88,S.count)):base);
}
function skip(){
  if(!S.running) return;
  clearTimeout(S.timer);
  const c=S.cfg; let k=S.count;
  if(decided(c,k)){ finish(c,k,`스킵 · ${k}회에서 확정`); return; }
  while(!decided(c,k)&&Math.random()<c.p) k++;
  $('roll').textContent='남은 판정을 즉시 계산했습니다.';
  finish(c,k,`스킵 · 즉시 계산 → ${k}회`);
}
function batch(){
  Snd.init();
  const c=refresh(); if(c.err||S.running) return;
  let last=null;
  for(let n=0;n<1000;n++){ let k=0; while(!decided(c,k)&&Math.random()<c.p) k++; const win=judge(c,k); S.runs++; if(win) S.wins++; last={k,win}; }
  pushHist(last.k,last.win); Snd.click(); refresh();
}

/* ---------- 팝업 ---------- */
let lastFocus=null, openModal=null;
function openM(id){ lastFocus=document.activeElement; refresh(); openModal=$(id); openModal.hidden=false; openModal.querySelector('[data-close]').focus(); }
function closeM(){ if(!openModal) return; openModal.hidden=true; openModal=null; saveSettings(); if(lastFocus) lastFocus.focus(); }
$('statsBtn').addEventListener('click',()=>openM('statsModal'));
$('setBtn').addEventListener('click',()=>openM('setModal'));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeM));
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeM(); }));

/* 설정 기억 (이 브라우저에만) */
const SET_IDS=['speed','maxspeed','decMP','decMN','decSP','decSN'];
function saveSettings(){ try{ const o={accel:$('accel').checked}; SET_IDS.forEach(i=>o[i]=$(i).value); localStorage.setItem('chainroll-set2',JSON.stringify(o)); }catch(e){} }
try{ const o=JSON.parse(localStorage.getItem('chainroll-set2')||'null'); if(o){ SET_IDS.forEach(i=>{ if(o[i]!=null) $(i).value=o[i]; }); $('accel').checked=!!o.accel; } }catch(e){}

/* ---------- 이벤트 ---------- */
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  if(S.running) return;
  S.mode=b.dataset.mode;
  document.querySelectorAll('.seg button').forEach(o=>o.setAttribute('aria-pressed',o===b));
  Snd.init(); Snd.click(); refresh();
}));
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',e=>{
  e.preventDefault();
  const [id,dv]=b.dataset.step.split(':'), el=$(id);
  const v=(parseInt(el.value,10)||0)+Number(dv), min=Number(el.min), max=el.max!==''?Number(el.max):Infinity;
  el.value=Math.min(max,Math.max(min,v)); refresh();
}));
['x','z','z2','decMP','decMN','decSP','decSN','speed','maxspeed','accel'].forEach(id=>$(id).addEventListener('input',refresh));
$('start').addEventListener('click',start);
$('skip').addEventListener('click',skip);
$('batch').addEventListener('click',batch);
$('reset').addEventListener('click',()=>{ S.runs=0; S.wins=0; S.hist=[]; S.att=0; S.succ=[]; paintHist(); paintAttempt(1,'now'); refresh(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&openModal){ closeM(); return; }
  if(e.code!=='Space'||openModal||['INPUT','SELECT','BUTTON','TEXTAREA'].includes(e.target.tagName)) return;
  e.preventDefault(); S.running?skip():start();
});
refresh();
paintAttempt(1,'now');

/* ---------- 모바일 화면 채우기 ---------- */
const BASE_W=300;
function fit(){
  const app=document.querySelector('.app'), root=document.documentElement;
  const mobile = window.innerWidth<=600;
  root.classList.toggle('fit',mobile);
  document.querySelectorAll('.modal').forEach(m=>m.style.zoom='');
  if(!mobile){ app.style.zoom=''; app.style.width=''; app.style.minHeight=''; app.style.height=''; return; }
  const cs=getComputedStyle(root), bs=getComputedStyle(document.body);
  const availW = window.innerWidth - parseFloat(bs.paddingLeft) - parseFloat(bs.paddingRight);
  const availH = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);
  // 자연 높이 측정 (숫자 영역 최소 크기 기준)
  app.style.zoom='1'; app.style.width=BASE_W+'px'; app.style.height=''; app.style.minHeight='';
  const natural = app.offsetHeight;
  const z = Math.max(1, Math.min(availW/BASE_W, availH/natural, 2.2));
  app.style.zoom=z;
  app.style.width=(availW/z)+'px';
  app.style.height=(availH/z)+'px';
  document.querySelectorAll('.modal').forEach(m=>m.style.zoom=Math.min(z,1.6));
}
let lastW=window.innerWidth;
window.addEventListener('resize',()=>{
  // 모바일 키보드가 올라와 높이만 줄어든 경우는 무시
  if(window.innerWidth===lastW && document.activeElement && document.activeElement.tagName==='INPUT') return;
  lastW=window.innerWidth; fit();
});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
fit();
</script>

</body>
</html>
