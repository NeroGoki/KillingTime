<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스킬 애니메이션 프리뷰 (12fps)</title>
<style>
  :root{
    --bg: #1b1d22;
    --panel: #24262e;
    --panel2: #2c2f39;
    --line: #3a3d48;
    --text: #ecedf1;
    --muted: #9a9db0;
    --accent: #ffcf33;
    --accent2: #ff7a59;
    --good: #4cd28a;
    --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,207,51,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,122,89,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{
    width:100%;
    max-width:920px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 24px;
    line-height:1.6;
  }
  .sub code{
    background:var(--panel2);
    border:1px solid var(--line);
    padding:1px 6px;
    border-radius:4px;
    color:var(--accent);
    font-size:12px;
  }
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:16px;
  }
  @media (max-width: 760px){
    .grid{ grid-template-columns: 1fr; }
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
  }
  .drop{
    border:2px dashed var(--line);
    border-radius:12px;
    padding:28px 16px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s, background .15s;
    color:var(--muted);
    font-size:13px;
  }
  .drop:hover, .drop.drag{
    border-color: var(--accent);
    background: rgba(255,207,51,0.05);
    color: var(--text);
  }
  .drop strong{ color:var(--text); display:block; margin-bottom:6px; font-size:14px;}
  input[type=file]{ display:none; }
  .status{
    margin-top:14px;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    display:none;
    line-height:1.5;
  }
  .status.ok{
    display:block;
    background: rgba(76,210,138,0.1);
    border:1px solid rgba(76,210,138,0.4);
    color: var(--good);
  }
  .status.err{
    display:block;
    background: rgba(255,93,93,0.1);
    border:1px solid rgba(255,93,93,0.4);
    color: var(--bad);
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .canvas-box{
    width:256px;
    height:256px;
    background:
      linear-gradient(45deg, #33353d 25%, transparent 25%),
      linear-gradient(-45deg, #33353d 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #33353d 75%),
      linear-gradient(-45deg, transparent 75%, #33353d 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color:#202128;
    border-radius:10px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #frameCanvas{
    image-rendering: pixelated;
    width:256px;
    height:256px;
  }
  .placeholder{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:0 20px;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    justify-content:center;
  }
  button{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition: background .15s, transform .1s, border-color .15s;
  }
  button:hover:not(:disabled){
    border-color: var(--accent);
  }
  button:active:not(:disabled){
    transform: scale(0.96);
  }
  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  #playOnceBtn, #playLoopBtn{
    background: var(--accent);
    color:#1b1d22;
    font-weight:600;
    border-color: var(--accent);
  }
  #playOnceBtn.active, #playLoopBtn.active{
    background: var(--accent2);
    border-color: var(--accent2);
    color:#1b1d22;
  }
  .meta{
    width:100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  .meta div{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
  }
  .meta b{
    color:var(--text);
    font-weight:600;
  }
  .strip-preview{
    margin-top:16px;
    width:100%;
  }
  .strip-preview .label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .strip-scroll{
    max-width:100%;
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:8px;
    background:#151519;
    padding:6px;
  }
  .strip-scroll img{
    height:64px;
    width:auto;
    display:block;
    image-rendering: pixelated;
  }
  .slider-row{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    font-size:12px;
    color:var(--muted);
  }
  input[type=range]{
    flex:1;
    accent-color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖍 스킬 애니메이션 프리뷰</h1>
  <p class="sub">
    유니티용 가로 스프라이트 시트: 세로 <code>64px</code>, 가로 <code>64 × a</code> px (1 ≤ a ≤ 50, 프레임을 가로로 이어붙인 시트) 이미지를 업로드하면
    자동으로 프레임 수를 인식해서 초당 <code>12프레임(12fps)</code>으로 재생해줍니다.
  </p>

  <div class="grid">
    <div class="card">
      <div class="drop" id="dropZone">
        <strong>이미지를 클릭하거나 드래그해서 올려주세요</strong>
        PNG 권장 · (64×a) × 64 픽셀 · a = 1~50
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <div class="status" id="statusBox"></div>

      <div class="strip-preview" id="stripWrap" style="display:none;">
        <div class="label">원본 스프라이트 시트</div>
        <div class="strip-scroll">
          <img id="stripImg" alt="sprite sheet">
        </div>
      </div>
    </div>

    <div class="card stage">
      <div class="canvas-box">
        <canvas id="frameCanvas" width="64" height="64" style="display:none;"></canvas>
        <div class="placeholder" id="placeholder">이미지를 업로드하면<br>여기서 재생됩니다</div>
      </div>

      <div class="controls">
        <button id="playOnceBtn" disabled>▶ 한번 재생</button>
        <button id="playLoopBtn" disabled>🔁 반복 재생</button>
        <button id="stopBtn" disabled>⏹ 정지</button>
        <button id="stepBtn" disabled>다음 프레임</button>
      </div>

      <div class="slider-row">
        <span>프레임</span>
        <input type="range" id="frameSlider" min="0" max="0" value="0" step="1" disabled>
        <span id="frameLabel">0 / 0</span>
      </div>

      <div class="meta">
        <div>프레임 수 <b id="metaFrames">-</b></div>
        <div>재생 속도 <b>12 fps</b></div>
        <div>이미지 크기 <b id="metaSize">-</b></div>
        <div>1프레임 재생시간 <b>≈ 83.3 ms</b></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const statusBox = document.getElementById('statusBox');
  const canvas = document.getElementById('frameCanvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholder');
  const playOnceBtn = document.getElementById('playOnceBtn');
  const playLoopBtn = document.getElementById('playLoopBtn');
  const stopBtn = document.getElementById('stopBtn');
  const stepBtn = document.getElementById('stepBtn');
  const frameSlider = document.getElementById('frameSlider');
  const frameLabel = document.getElementById('frameLabel');
  const metaFrames = document.getElementById('metaFrames');
  const metaSize = document.getElementById('metaSize');
  const stripWrap = document.getElementById('stripWrap');
  const stripImg = document.getElementById('stripImg');

  const FRAME_SIZE = 64;
  const FPS = 12;
  const FRAME_MS = 1000 / FPS;

  let img = null;
  let frameCount = 0;
  let currentFrame = 0;
  let playing = false;
  let loopMode = false;
  let lastTime = 0;
  let rafId = null;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });

  function showStatus(msg, ok){
    statusBox.textContent = msg;
    statusBox.className = 'status ' + (ok ? 'ok' : 'err');
  }

  function handleFile(file){
    if (!file.type.startsWith('image/')) {
      showStatus('이미지 파일만 업로드할 수 있습니다.', false);
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const image = new Image();
      image.onload = () => validateAndLoad(image, file);
      image.onerror = () => showStatus('이미지를 불러오지 못했습니다.', false);
      image.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function validateAndLoad(image, file){
    const w = image.naturalWidth;
    const h = image.naturalHeight;

    if (h !== FRAME_SIZE) {
      showStatus('❌ 세로 크기가 64px가 아닙니다. (현재: ' + h + 'px)', false);
      resetStage();
      return;
    }
    if (w % FRAME_SIZE !== 0) {
      showStatus('❌ 가로 크기가 64의 배수가 아닙니다. (현재: ' + w + 'px)', false);
      resetStage();
      return;
    }
    const a = w / FRAME_SIZE;
    if (a < 1 || a > 50) {
      showStatus('❌ 프레임 수(a)가 범위를 벗어났습니다. (현재 a = ' + a + ', 허용 범위 1~50)', false);
      resetStage();
      return;
    }

    // valid
    img = image;
    frameCount = a;
    currentFrame = 0;
    stopPlayback();

    showStatus('✅ 로드 완료! 총 ' + a + '프레임 (' + w + ' × 64)', true);

    canvas.style.display = 'block';
    placeholder.style.display = 'none';
    playOnceBtn.disabled = false;
    playLoopBtn.disabled = false;
    stopBtn.disabled = false;
    stepBtn.disabled = false;
    frameSlider.disabled = false;
    frameSlider.max = frameCount - 1;
    frameSlider.value = 0;

    metaFrames.textContent = frameCount;
    metaSize.textContent = w + ' × ' + h;

    stripWrap.style.display = 'block';
    stripImg.src = image.src;

    playOnceBtn.classList.remove('active');
    playLoopBtn.classList.remove('active');
    playing = false;
    loopMode = false;
    updateButtonStates();
    updateFrameLabel();
    drawFrame(0);
  }

  function resetStage(){
    img = null;
    frameCount = 0;
    currentFrame = 0;
    stopPlayback();
    loopMode = false;
    canvas.style.display = 'none';
    placeholder.style.display = 'block';
    playOnceBtn.disabled = true;
    playLoopBtn.disabled = true;
    stopBtn.disabled = true;
    stepBtn.disabled = true;
    frameSlider.disabled = true;
    frameSlider.max = 0;
    frameSlider.value = 0;
    metaFrames.textContent = '-';
    metaSize.textContent = '-';
    stripWrap.style.display = 'none';
    frameLabel.textContent = '0 / 0';
  }

  function drawFrame(index){
    if (!img) return;
    ctx.clearRect(0, 0, FRAME_SIZE, FRAME_SIZE);
    ctx.drawImage(
      img,
      index * FRAME_SIZE, 0, FRAME_SIZE, FRAME_SIZE,
      0, 0, FRAME_SIZE, FRAME_SIZE
    );
  }

  function updateFrameLabel(){
    frameLabel.textContent = (currentFrame + 1) + ' / ' + frameCount;
    frameSlider.value = currentFrame;
  }

  function stepFrame(){
    currentFrame = (currentFrame + 1) % frameCount;
    drawFrame(currentFrame);
    updateFrameLabel();
  }

  function loop(timestamp){
    if (!playing) return;
    if (timestamp - lastTime >= FRAME_MS) {
      lastTime = timestamp;

      if (currentFrame >= frameCount - 1 && !loopMode) {
        // 마지막 프레임까지 이미 재생됨 -> 한번 재생 종료
        stopPlayback();
        return;
      }
      stepFrame();
    }
    rafId = requestAnimationFrame(loop);
  }

  function startPlayback(loop_){
    if (!img || frameCount === 0) return;
    loopMode = loop_;

    // 한번 재생을 마지막 프레임에서 다시 누르면 처음부터 시작
    if (!loopMode && currentFrame >= frameCount - 1) {
      currentFrame = 0;
      drawFrame(currentFrame);
      updateFrameLabel();
    }

    playing = true;
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
    updateButtonStates();
  }

  function stopPlayback(){
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    updateButtonStates();
  }

  function updateButtonStates(){
    playOnceBtn.classList.toggle('active', playing && !loopMode);
    playLoopBtn.classList.toggle('active', playing && loopMode);
    playOnceBtn.textContent = (playing && !loopMode) ? '⏸ 재생 중' : '▶ 한번 재생';
    playLoopBtn.textContent = (playing && loopMode) ? '⏸ 재생 중' : '🔁 반복 재생';
  }

  playOnceBtn.addEventListener('click', () => {
    if (playing && !loopMode) { stopPlayback(); return; }
    startPlayback(false);
  });

  playLoopBtn.addEventListener('click', () => {
    if (playing && loopMode) { stopPlayback(); return; }
    startPlayback(true);
  });

  stopBtn.addEventListener('click', () => {
    stopPlayback();
  });

  stepBtn.addEventListener('click', () => {
    stopPlayback();
    stepFrame();
  });

  frameSlider.addEventListener('input', (e) => {
    stopPlayback();
    currentFrame = parseInt(e.target.value, 10);
    drawFrame(currentFrame);
    updateFrameLabel();
  });
})();
</script>
</body>
</html>
